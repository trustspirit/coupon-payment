spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/board
    username: board
    password: boardpw
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-at-least-32-bytes}
  access-token-validity-ms: 900000      # 15분
  refresh-token-validity-ms: 1209600000 # 14일

app:
  cookie:
    secure: true
    same-site: Strict
